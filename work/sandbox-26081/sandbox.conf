# SereneDB 26.08.1 sandbox — отдельный --server_directory (правило ivf-опытов).
# Стиль флагов — из /etc/serenedb/serened.conf (только чтение оригинала).
# memory_limit ≤ 40 GiB: на dev работают другие процессы.

--server_directory=/srv/1c/work/sandbox-26081/data
--listen=postgres://127.0.0.1:7895
--log_level=info
--log_storage=file
--log_path=/srv/1c/work/sandbox-26081/logs
--cpu_threads=6
--io_threads=4
# memory_limit в 26.08.1 — только SET/PRAGMA в сессии, не flagfile (доки configuration/pragmas#memory-limit).
# Потолок RSS при замерах — measure-cmd.sh (40 GiB).
