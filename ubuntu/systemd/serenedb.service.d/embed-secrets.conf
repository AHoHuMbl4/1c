[Service]
# После каждого старта/рестарта движка — идемпотентно пересоздать персистентные секреты.
# Прямой вызов установщика (не через менеджер юнитов): из User=serenedb polkit
# отказывает в start соседнего oneshot. Префикс «-» — сбой не роняет serenedb;
# «+» — от root (как отдельный oneshot). EnvironmentFile — те же ключи/хосты,
# что у dedicated oneshot-юнита секретов.
EnvironmentFile=-/etc/1c-embed.env
ExecStartPost=-+/bin/sh -c '/opt/1c-mcp-reports/embed_secrets_install.sh'
