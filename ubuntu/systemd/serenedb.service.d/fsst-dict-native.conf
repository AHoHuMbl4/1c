# 🔴 ВРЕМЕННЫЙ обход бага SereneDB 26.08.1 «dict_fsst: несоответствие размера
# словаря» (транзиентный, ронял order-INSERT corpus_build.sql:1532; подтверждён
# разработчиками 03.09). Рекомендация их стороны: SET force_dict_fsst_mode =
# 'AUTO_NATIVE' — нативное сжатие вместо fsst-словарей (рост базы на диске ~30%).
# 🔴 СНЯТЬ ПОСЛЕ ИХ ФИКСА: удалить этот файл, systemctl daemon-reload, рестарт
# serenedb. Настройка слетает с рестартом движка (как wal_autocheckpoint) —
# потому и ExecStartPost, а не конфиг. Ретрей ×2 с паузой: psql в ExecStartPost
# может обогнать готовность порта 7890 (армия 08.09: «|| true» глотало молча).
[Service]
ExecStartPost=-/bin/sh -c 'psql "host=127.0.0.1 port=7890 user=postgres dbname=postgres" -c "SET GLOBAL force_dict_fsst_mode = '\''AUTO_NATIVE'\''" || { sleep 3; psql "host=127.0.0.1 port=7890 user=postgres dbname=postgres" -c "SET GLOBAL force_dict_fsst_mode = '\''AUTO_NATIVE'\''"; } || true'
