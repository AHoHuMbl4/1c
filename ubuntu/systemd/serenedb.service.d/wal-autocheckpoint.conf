[Service]
# О5: порог авто-checkpoint WAL после старта движка (слетает с рестартом; CLI-флага нет).
# Тип VARCHAR (доки configuration/overview#global-configuration-options, пример 1GB).
# Без двойных кавычек: "512MB" — идентификатор → syntax error (живой инцидент).
# Форма 512MB без кавычек — как memory settings DuckDB/Serene; живую сверку формата
# на сборке 26.07.3 делает оркестратор (psql SET GLOBAL + duckdb_settings).
ExecStartPost=-/bin/sh -c 'psql "host=127.0.0.1 port=7890 user=postgres dbname=postgres" -c "SET GLOBAL wal_autocheckpoint = 512MB" || true'
