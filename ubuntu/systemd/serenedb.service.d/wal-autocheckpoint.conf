[Service]
# О5: порог авто-checkpoint WAL после старта движка (слетает с рестартом; CLI-флага нет).
# Тип VARCHAR, значение строкой с единицей в ОДИНАРНЫХ кавычках:
#   двойные "512MB" — идентификатор → syntax error; без кавычек 512MB/512 — тоже
#   syntax error / «Unknown unit for memory» (живой замер 31.08 на 26.07.3);
#   '512MB' — SET проходит, duckdb_settings показывает 488.2 MiB (=512e6 байт).
ExecStartPost=-/bin/sh -c 'psql "host=127.0.0.1 port=7890 user=postgres dbname=postgres" -c "SET GLOBAL wal_autocheckpoint = '\''512MB'\''" || true'
