# EU-релей 1c-gate.timpul.pro (2.28.54.129, «pro-router», Ubuntu 26.04).
# Копия relay/haproxy.cfg (RU-релей 89.23.101.22) с отличиями:
#   1) домен — 1c-gate.timpul.pro (LE-серт выпущен 12.08, HTTP-01 через :80);
#   2) backend'ы EU-юнитов приватной сети 10.3.0.0/24 — по CN клиентского
#      сертификата, образец relay/haproxy.cfg (medteh-ut).
global
    log /dev/log len 8192 local0 info
    maxconn 4096
    user haproxy
    group haproxy
    stats socket /run/haproxy-admin.sock mode 600 level admin
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option redispatch
    timeout connect 10s
    timeout client 300s
    timeout server 300s
    timeout http-request 30s

frontend fe_http
    bind :80
    acl acme path_beg /.well-known/acme-challenge/
    use_backend be_acme if acme
    redirect scheme https code 301 if !acme

frontend fe_https
    # mTLS: клиентский серт проектного CA обязателен (контракт §8, замер 07.08)
    bind :443 ssl crt /etc/haproxy/certs/1c-gate.timpul.pro.pem verify required ca-file /etc/haproxy/1c-packet-ca.crt
    option forwardfor
    http-request set-header X-SSL-Client-CN %[ssl_c_s_dn(cn)]
    # маршрутизация по CN клиентского сертификата (по образцу RU-релея)
    acl cn_okna_1 ssl_c_s_dn(cn) -m str okna-1
    use_backend packet_unit_okna_1 if cn_okna_1
    default_backend be_packet_ubuntu

backend be_acme
    server acme 127.0.0.1:8402

backend packet_unit_okna_1
    option httpchk GET /health
    http-check expect status 200
    server okna 10.3.1.11:6090 check inter 5s fall 3 rise 2

backend be_packet_ubuntu
    option httpchk GET /health
    http-check expect status 200
    server ubuntu 127.0.0.1:6022 check inter 5s fall 3 rise 2
