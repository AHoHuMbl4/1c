# EU-релей 1c-gate-eu.timpul.ru (2.28.54.129, «pro-router», Ubuntu 26.04).
# Копия relay/haproxy.cfg (RU-релей 89.23.101.22) с двумя отличиями:
#   1) домен — 1c-gate-eu.timpul.ru (свой LE-серт, DNS — рычаг владельца);
#   2) backend'ов юнитов приватной сети нет: сеть 10.3.0.0/24 этого хостера до
#      RU-юнитов (10.1.1.x) не доходит. Когда появятся EU-юниты — добавить
#      acl/use_backend по CN по образцу relay/haproxy.cfg (medteh-ut).
global
    log /dev/log len 8192 local0 info
    maxconn 4096
    user haproxy
    group haproxy
    stats socket /run/haproxy-admin.sock mode 600 level admin
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option redispatch
    timeout connect 10s
    timeout client 300s
    timeout server 300s
    timeout http-request 30s

frontend fe_http
    bind :80
    acl acme path_beg /.well-known/acme-challenge/
    use_backend be_acme if acme
    redirect scheme https code 301 if !acme

frontend fe_https
    # mTLS: клиентский серт проектного CA обязателен (контракт §8, замер 07.08)
    bind :443 ssl crt /etc/haproxy/certs/1c-gate-eu.timpul.ru.pem verify required ca-file /etc/haproxy/1c-packet-ca.crt
    option forwardfor
    http-request set-header X-SSL-Client-CN %[ssl_c_s_dn(cn)]
    default_backend be_packet_ubuntu

backend be_acme
    server acme 127.0.0.1:8402

backend be_packet_ubuntu
    option httpchk GET /health
    http-check expect status 200
    server ubuntu 127.0.0.1:6022 check inter 5s fall 3 rise 2
