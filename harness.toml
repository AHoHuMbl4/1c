# Конфигурация claude-code-harness для этого проекта (пилот 03.08).
# Минимальная: проект работает через ПЛАГИН, поэтому standalone-раскладку
# (hooks/hooks.json, .claude-plugin/) НЕ заводим — при живом плагине она дала бы
# двойное срабатывание хуков. Наши CLAUDE.md и .claude/settings.json генератору
# харнесса не принадлежат и им не перезаписываются.

[project]
name = "1c"
version = "0.1.0"
description = "Коробочный ИИ-помощник по данным 1С поверх SereneDB (контракт — TARGET.md)"

[i18n]
# Русского у харнесса нет (en|ja). Язык ответов владельцу — русский — закреплён
# в CLAUDE.md как явное указание и перекрывает эту настройку по их же правилу.
language = "en"

[safety.permissions]
# Правило владельца (CLAUDE.md): коммит и push в origin/main после КАЖДОГО шага.
# Их умолчание "ask" дёргало бы подтверждение на каждый пуш каждой сессии.
protectedBranchPush = "allow"
