# Пример файла настроек для setup-1c-odata.exe
#   запуск:  setup-1c-odata.exe --config setup-1c-odata.ini --unattended
# Ключи командной строки имеют приоритет над этим файлом.
# ВНИМАНИЕ: если впишете сюда пароли — ограничьте доступ к файлу и удалите после настройки.

# --- база (одно из двух) ---
base = C:\1c\bases\buh_test
# connstr = Srvr='srv-1c';Ref='erp';

# --- публикация в IIS ---
alias = 1c
# dir  = C:\inetpub\1c
# site = Default Web Site
# app-pool = 1c-odata

# --- учётные данные 1С ---
# Пользователь с полными правами — нужен ТОЛЬКО для задания состава OData (шаг 12).
admin-user = Администратор
# admin-password = ...        # лучше не хранить здесь: без него пароль спросят скрытно,
#                             # либо используйте ключ --admin-password-env ИМЯ_ПЕРЕМЕННОЙ

# Пользователь-читатель (создаётся ВРУЧНУЮ). Если указать — инструмент проверит,
# что он существует, покажет его роли и предупредит о лишних правах.
reader-user = ai_reader
# reader-password = ...       # если указать, финальная проверка пойдёт под ним

# --- состав OData ---
#   default   — справочники + документы
#   analytics — + регистры (обороты/остатки), планы счетов, перечисления
#   all       — все разделы
#   либо список: catalogs,documents,accumulation-registers
scope = default

# --- прочее ---
backup-dir = C:\1c\backups
# no-backup = 0
# open-firewall = 192.168.56.0/24
# external-url = http://192.168.56.1:6003/1c/odata/standard.odata/
